<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }} | {{ site.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <script>
      (function () {
        var saved = localStorage.getItem("cloud-engineer-roadmap:theme");
        if (saved === "light") document.documentElement.setAttribute("data-theme", "light");
      })();
    </script>
  </head>

  <body>
    <div class="reading-progress" id="reading-progress"></div>

    <div class="site-header">
      <div class="site-header-inner">

        <div class="site-header-left">
          <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Abrir menu de navegação" aria-expanded="false">
            <i class="fas fa-bars"></i>
          </button>
          <a href="{{ '/' | relative_url }}" class="site-logo"><i class="fas fa-home fa-fw"></i><span>Início</span></a>
        </div>

        <div class="site-header-right">
          <button id="theme-toggle" class="theme-toggle" aria-label="Alternar tema claro/escuro">
            <i class="fas fa-sun theme-icon-light"></i>
            <i class="fas fa-moon theme-icon-dark"></i>
          </button>
          <a href="https://github.com/therenanlira/cloud-engineer-roadmap" target="_blank" rel="noopener noreferrer" class="site-github-link"><i class="fab fa-github fa-fw"></i><span class="site-link-text">GitHub</span></a>
          <a href="https://github.com/therenanlira/cloud-engineer-roadmap/stargazers" target="_blank" rel="noopener noreferrer" class="site-stars-link">
            <img src="https://img.shields.io/github/stars/therenanlira/cloud-engineer-roadmap?style=social" alt="GitHub stars">
          </a>
        </div>

      </div>
    </div>

    <div class="page-shell">
      {% include sidebar.html %}
      <div class="container main-content" style="flex: 1;">
        {% unless page.url == "/" %}
        {% include breadcrumb.html %}
        {% endunless %}
        {{ content }}
      </div>
    </div>

    {% include footer.html %}
    <script src="{{ '/assets/js/site.js' | relative_url }}"></script>
  </body>
</html>
