apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotrod
  namespace: monitoring
  labels:
    app: hotrod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hotrod
  template:
    metadata:
      labels:
        app: hotrod
        logs: enabled
    spec:
      containers:
      - name: hotrod
        image: jaegertracing/example-hotrod:latest
        args: ["all"]
        env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://jaeger.monitoring:4318"
        - name: OTEL_TRACES_EXPORTER
          value: "otlp"
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: hotrod
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: hotrod
  ports:
    - port: 8080
      targetPort: 8080
